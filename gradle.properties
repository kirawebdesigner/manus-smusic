org.gradle.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8 -Dkotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Compile Kotlin inside the Gradle daemon (no extra compiler daemon process):
# keeps builds reliable on low-memory CI/sandbox machines.
kotlin.compiler.execution.strategy=in-process
